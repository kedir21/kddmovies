name: Build Android TV Release APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Deployed KD Movies HTTPS URL (e.g. https://kddmovies.vercel.app)'
        required: false
        default: 'https://kddmovies.vercel.app'
  push:
    branches:
      - main
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android TV Release APK
        working-directory: android-tv
        env:
          KD_APP_URL: ${{ github.event.inputs.app_url || vars.KD_APP_URL || 'https://kddmovies.vercel.app' }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KD-Movies-Android-TV-release
          path: android-tv/app/build/outputs/apk/release/*.apk
